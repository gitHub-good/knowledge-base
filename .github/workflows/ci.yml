name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 链接与待办/需求校验 + 工具自测
        run: |
          python tools/check_links.py
          python tools/todo.py
          python tools/req.py
          python tools/test_tools.py
